version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify 환경 변수를 서버 런타임에서도 읽을 수 있도록 .env.production 에 기록
        - env | grep -e NEXT_PUBLIC_ -e S3_ >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
